{% if audio_embed_url %}
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="fas fa-headphones text-primary" aria-hidden="true"></i>
            <strong>Audio lesson</strong>
        </div>

        <iframe
            title="{{ content.title }} audio"
            width="100%"
            height="166"
            scrolling="no"
            frameborder="no"
            allow="autoplay"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            src="{{ audio_embed_url }}">
        </iframe>
    </div>
</div>
{% endif %}

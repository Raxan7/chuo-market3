{% extends 'app/base.html' %}
{% load static %}

{% block title %}Delete {{ object.title }} - ChuoSmart{% endblock %}

{% block main-content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <i class="fas fa-exclamation-triangle fa-4x text-warning"></i>
                    </div>
                    <h2 class="h3 mb-3">Delete Material</h2>
                    <p class="text-muted mb-4">
                        Are you sure you want to delete <strong>"{{ object.title }}"</strong>?
                        This action cannot be undone.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-trash me-2"></i>Yes, Delete
                            </button>
                            <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary btn-lg">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

  class="cs-adsense-in-article"
  aria-label="Advertisement"
  style="width:100%;overflow:hidden;margin:16px auto;"
>
  <div
    data-adsense-slot
    data-adsense-state="pending"
    style="width:100%;min-height:180px;overflow:hidden;"
  >
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-layout="in-article"
         data-ad-format="fluid"
         data-ad-client="ca-pub-1815335112679958"
         data-ad-slot="5625079304"></ins>
  </div>
</aside>

{% load ad_tags %}
{% if show_list_ads %}
  {% adsterra_smartlink forloop.counter as smartlink %}
<div class="card border-0 shadow-sm list-ad-card adsterra-ad-card h-100">
  <div class="card-body p-2 p-md-3 d-flex flex-column">
    <div class="small text-uppercase text-muted mb-2">Sponsored</div>
    <div class="flex-grow-1 position-relative ad-iframe-wrap">
      <iframe
        class="ad-iframe adsterra-native-iframe"
        title="Sponsored Ad"
        loading="lazy"
        src="about:blank"
        data-ad-type="adsterra-native"
        data-ad-script-src="https://pl31147888.profitableratecpmnetwork.com/6ecede6ab74b91de2adf4bd985213f25/invoke.js"
        data-ad-container-id="container-6ecede6ab74b91de2adf4bd985213f25"
        data-smartlink-number="{{ smartlink.number }}"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
        scrolling="no"
      ></iframe>
    </div>
  </div>
</div>
{% endif %}

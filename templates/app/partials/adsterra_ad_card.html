{% load ad_tags %}
{% if show_list_ads %}
  {% adsterra_smartlink forloop.counter as smartlink %}
<a
  class="card border-0 shadow-sm list-ad-card adsterra-ad-card h-100 text-decoration-none text-reset"
  href="{{ smartlink.url }}"
  target="_blank"
  rel="sponsored nofollow noopener"
  referrerpolicy="strict-origin-when-cross-origin"
  data-adsterra-smartlink
  data-smartlink-number="{{ smartlink.number }}"
  aria-label="Open sponsored content in a new tab"
>
  <div class="card-body p-2 p-md-3 d-flex flex-column">
    <div class="small text-uppercase text-muted mb-2">Sponsored</div>
    <div class="flex-grow-1 d-flex align-items-center justify-content-center text-center py-4 px-2">
      <div>
        <i class="fas fa-external-link-alt fa-2x mb-3 text-primary" aria-hidden="true"></i>
        <div class="fw-semibold">Sponsored content</div>
        <div class="small text-muted mt-1">View offer</div>
      </div>
    </div>
  </div>
</a>
{% endif %}

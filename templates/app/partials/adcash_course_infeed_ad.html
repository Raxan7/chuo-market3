{% if ads_allowed %}
<aside
  class="cs-adcash-infeed cs-course-grid-ad"
  aria-label="Advertisement"
  style="
    width:100%;
    min-height:270px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:12px 0;
  "
>
  <small
    style="
      display:block;
      margin-bottom:6px;
      font-size:11px;
      opacity:.65;
      text-align:center;
    "
  >
    Advertisement
  </small>

  <div
    data-adcash-banner-slot
    data-zone-mobile="12270198"
    data-zone-desktop="12270190"
    data-zone-breakpoint="767.98"
    data-adcash-state="pending"
    style="
      width:100%;
      max-width:300px;
      min-height:250px;
      display:flex;
      justify-content:center;
      overflow:hidden;
    "
  ></div>
</aside>
{% endif %}

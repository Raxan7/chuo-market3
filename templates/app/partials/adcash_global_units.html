{% if ads_allowed and not premium_surface %}
<section
  class="cs-adcash-after-content"
  aria-label="Advertisement"
  style="
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 24px auto;
    overflow: hidden;
  "
>
  <div
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 250px;
      max-width: 100%;
      overflow: hidden;
    "
  >
    <script type="text/javascript">
      (function () {
        if (
          typeof aclib === "undefined" ||
          typeof aclib.runBanner !== "function"
        ) {
          return;
        }

        // Mobile gets 250x250.
        // Everything larger gets 300x250.
        var zoneId = window.matchMedia(
          "(max-width: 575.98px)"
        ).matches
          ? "12270198"
          : "12270190";

        aclib.runBanner({
          zoneId: zoneId,
        });
      })();
    </script>
  </div>
</section>

<aside
  id="cs-adcash-wide-rail"
  aria-label="Advertisement"
  style="
    display: none;
    position: fixed;
    top: 120px;
    right: 16px;
    width: 160px;
    min-height: 600px;
    overflow: hidden;
    z-index: 20;
  "
>
  <script type="text/javascript">
    (function () {
      // Do not even request the 160x600 ad unless there is
      // enough viewport space to keep it outside normal content.
      if (
        !window.matchMedia(
          "(min-width: 1800px)"
        ).matches
      ) {
        return;
      }

      if (
        typeof aclib === "undefined" ||
        typeof aclib.runBanner !== "function"
      ) {
        return;
      }

      var rail = document.getElementById(
        "cs-adcash-wide-rail"
      );

      if (rail) {
        rail.style.display = "block";
      }

      aclib.runBanner({
        zoneId: "12270182",
      });
    })();
  </script>
</aside>
{% endif %}

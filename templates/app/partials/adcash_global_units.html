{% if ads_allowed and not premium_surface %}
<section
  class="cs-adcash-after-content"
  aria-label="Advertisement"
  style="
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 24px auto;
    overflow: hidden;
  "
>
  <div
    data-adcash-banner-slot
    data-zone-mobile="12270198"
    data-zone-desktop="12270190"
    data-zone-breakpoint="575.98"
    data-adcash-state="pending"
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 250px;
      max-width: 100%;
      overflow: hidden;
    "
  ></div>
</section>

<aside
  id="cs-adcash-wide-rail"
  aria-label="Advertisement"
  style="
    display: none;
    position: fixed;
    top: 120px;
    right: 16px;
    width: 160px;
    min-height: 600px;
    overflow: hidden;
    z-index: 20;
  "
>
  <div
    data-adcash-banner-slot
    data-zone="12270182"
    data-adcash-min-width="1800"
    data-adcash-reveal-parent="cs-adcash-wide-rail"
    data-adcash-state="pending"
    style="width:160px;min-height:600px;overflow:hidden;"
  ></div>
</aside>
{% endif %}

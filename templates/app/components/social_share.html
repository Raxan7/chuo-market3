{# Render via {% share_buttons title public_path %}; URLs are prepared and encoded server-side. #}
<div class="cs-share{% if share_compact %} cs-share--compact{% endif %}" data-share-url="{{ share_url }}" data-share-title="{{ share_title }}" aria-label="Share {{ share_title }}">
  {% if not share_compact %}<span class="cs-share__label">Share this page</span>{% endif %}
  <div class="cs-share__actions">
    <a href="{{ share_whatsapp }}" target="_blank" rel="noopener noreferrer" class="cs-share__action" aria-label="Share on WhatsApp" title="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i><span>WhatsApp</span></a>
    <a href="{{ share_facebook }}" target="_blank" rel="noopener noreferrer" class="cs-share__action" aria-label="Share on Facebook" title="Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i><span>Facebook</span></a>
    <a href="{{ share_x }}" target="_blank" rel="noopener noreferrer" class="cs-share__action" aria-label="Share on X" title="X"><i class="fab fa-twitter" aria-hidden="true"></i><span>X</span></a>
    <a href="{{ share_linkedin }}" target="_blank" rel="noopener noreferrer" class="cs-share__action" aria-label="Share on LinkedIn" title="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i><span>LinkedIn</span></a>
    <a href="{{ share_email }}" class="cs-share__action" aria-label="Share by email" title="Email"><i class="fas fa-envelope" aria-hidden="true"></i><span>Email</span></a>
    <button type="button" class="cs-share__action cs-share__copy" aria-label="Copy share link" title="Copy link"><i class="fas fa-link" aria-hidden="true"></i><span>Copy link</span></button>
    <button type="button" class="cs-share__action cs-share__native" aria-label="Open device share options" title="More sharing options" hidden><i class="fas fa-share-alt" aria-hidden="true"></i><span>More</span></button>
  </div>
  <span class="cs-share__status visually-hidden" role="status" aria-live="polite"></span>
</div>

# ChuoSmart team prototype on Render.
# This Blueprint is independent of the existing Namecheap deployment.
services:
  - type: web
    name: chuosmart-prototype
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DJANGO_ENV
        value: render
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chuosmart-prototype-db
          property: connectionString
      - key: RENDER_ENABLE_OUTBOUND_EMAIL
        value: "false"
      - key: CEREBRAS_STRICT_ASSESSMENTS
        value: "false"
      - key: RENDER_RUN_MIGRATIONS
        value: "true"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"

# This is a disposable test database. It is intentionally separate from the
# MySQL database used by the Namecheap production deployment.
databases:
  - name: chuosmart-prototype-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: chuosmart_prototype
    user: chuosmart_prototype
